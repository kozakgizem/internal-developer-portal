[project]
name = "internal-developer-portal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gizem Kozak", email = "kozakgizem10@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt<4.1.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "psutil>=7.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
